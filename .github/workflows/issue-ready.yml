name: Default issue dispatch

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

concurrency:
  group: issue-ready-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of issue text. All authors receive the same default.
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const {data: issue} = await github.rest.issues.get({owner, repo, issue_number});
            const labels = new Set(issue.labels.map(label => label.name));
            const excluded = ['ai-planning', 'ai-epic', 'ai-paused', 'ai-in-progress',
              'ai-pr-opened', 'ai-fix-needed', 'ai-awaiting-merge', 'ai-merged',
              'ai-blocked', 'ai-needs-detail'];
            if (issue.state !== 'open' || issue.pull_request || excluded.some(label => labels.has(label))) {
              core.info('Preserving planning, ownership, recovery or explicit pause.');
              return;
            }
            if (labels.has('ai-ready')) return;
            try {
              await github.rest.issues.getLabel({owner, repo, name: 'ai-ready'});
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({owner, repo, name: 'ai-ready',
                  color: 'bfdadc', description: 'Ready for Orbi delivery'});
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                await github.rest.issues.getLabel({owner, repo, name: 'ai-ready'});
              }
            }
            await github.rest.issues.addLabels({owner, repo, issue_number, labels: ['ai-ready']});
