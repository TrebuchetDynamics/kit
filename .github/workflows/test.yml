name: test
'on':
  pull_request:
  push:
    branches: [main]
    tags: ['**']
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - &setup-python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - &prepare-tests
        name: Prepare offline tests
        run: |
          export TMPDIR="$RUNNER_TEMP"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          python -m pip install -r requirements-test.txt
      - name: Plugin syntax
        run: python -m py_compile __init__.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pi command adapter offline tests
        run: node --test tests/portable_pi.test.mjs
  runner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *prepare-tests
      - name: Offline suite, shard ${{ matrix.shard }} of 3
        run: python scripts/check.py --shard ${{ matrix.shard }}/3
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - *setup-python
      - *prepare-tests
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Plugin syntax
        run: python -m py_compile __init__.py
      - name: Pi command adapter offline tests
        run: node --test tests/portable_pi.test.mjs
      - name: Full offline Python suite
        run: python scripts/check.py
