name: test
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Git identity
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Shared and workflow offline suites
        run: python scripts/check.py --exclude tests/native
      - name: Plugin syntax
        run: python -m py_compile __init__.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pi command adapter offline tests
        run: node --test tests/portable_pi.test.mjs
  # Preserve required runner (1), runner (2), runner (3) contexts. These now
  # partition retained native integration-boundary fixtures, not an executor.
  runner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Git identity
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Native boundary fixtures, shard ${{ matrix.shard }} of 3
        run: python scripts/check.py tests/native --shard ${{ matrix.shard }}/3
