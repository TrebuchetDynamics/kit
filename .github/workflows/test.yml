name: test
on: [push, pull_request]
jobs:
  # Everything except the runner integration module: about 170 modules in a few minutes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Runner, worker and check fixtures take an existing $TMPDIR for granted, as every
      # host that runs Autowork sets one; the runner image leaves it unset. (The runner
      # context is not available to a job-level env, so a step exports it.)
      - name: Temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # The engine commits and merges as the host's Git user (it drops GIT_* variables), as on
      # any machine that runs it; the runner image has none.
      - name: Git identity
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Offline suites without the runner integration module
        run: python scripts/check.py --exclude tests/test_pi_autowork.py
      - name: Plugin syntax
        run: python -m py_compile __init__.py
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Pi command adapter offline tests
        run: node --test tests/portable_pi.test.mjs
  # The runner integration module alone is three quarters of the suite's time: each of its
  # tests starts a real runner over a Git fixture. Three machines share its tests by id.
  runner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Git identity
        run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Runner integration module, shard ${{ matrix.shard }} of 3
        run: python scripts/check.py tests/test_pi_autowork.py --shard ${{ matrix.shard }}/3
