<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kit plans. GitHub queues. Orbi delivers through PR gates.</title>
  <desc id="desc">Conceptual sequence, not live delivery evidence: Kit planning publishes complete GitHub Issues. Orbi uses Pi for implementation and tests, then opens a PR for independent review and merge gates.</desc>
  <rect width="1200" height="420" rx="16" fill="#101a18"/>
  <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="24" fill="#aab8ae">
    <text x="64" y="52">01</text><text x="650" y="52">02</text>
    <text x="64" y="254">03</text><text x="650" y="254">04</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="60" font-weight="600" fill="#f4f3e8">
    <text x="64" y="124">Kit</text><text x="650" y="124">GitHub Issues</text>
    <text x="64" y="326" fill="#b7e88c">Orbi + Pi</text>
    <text x="650" y="326">PR / review</text><text x="650" y="388">Merge gates</text>
  </g>
  <g fill="none" stroke="#aab8ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 106 h180 m-12 -10 12 10 -12 10"/>
    <path d="M1050 154 v30 H90 v30 m-10 -12 10 12 10 -12"/>
    <path d="M430 308 h140 m-12 -10 12 10 -12 10"/>
  </g>
</svg>
